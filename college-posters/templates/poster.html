<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>院校海报</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f0e1;
    --card: #fffdf7;
    --ink: #1e2a23;
    --ink2: #4a554e;
    --muted: #7d837c;
    --green: #0b6b3f;
    --red: #b4322a;
    --gold: #b8862b;
    --c1: #0b6b3f; --c2: #2f6f8f; --c3: #b8862b; --c4: #a8463a; --c5: #5b5f97; --c6: #3f7f6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ddd; font-family: "Noto Sans SC", "WenQuanYi Zen Hei", sans-serif; color: var(--ink); }
  #poster {
    width: 1080px; height: 1920px; overflow: hidden; position: relative;
    background:
      radial-gradient(circle at 12% 8%, rgba(184,134,43,.10), transparent 40%),
      radial-gradient(circle at 90% 60%, rgba(11,107,63,.08), transparent 45%),
      var(--paper);
    padding: 40px 44px 0;
    display: flex; flex-direction: column;
  }
  /* 页眉 */
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
  .series { background: var(--green); color: #fff; padding: 8px 22px 8px 16px; border-radius: 4px 22px 22px 4px; font-weight: 700; letter-spacing: 2px; }
  .city { color: var(--ink2); font-weight: 500; letter-spacing: 2px; }
  .city i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 8px; }
  .title { font-family: "Ma Shan Zheng", serif; font-size: 128px; line-height: 1.05; text-align: center; letter-spacing: 6px; margin-top: 6px; color: #13201a; }
  .en { text-align: center; font-family: "Noto Serif SC", serif; font-size: 20px; letter-spacing: 6px; color: var(--ink2); text-transform: uppercase; margin-top: -4px; }
  .tags { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
  .tag { border: 2px solid var(--green); color: var(--green); font-weight: 700; font-size: 22px; padding: 3px 18px; border-radius: 22px; background: rgba(255,255,255,.6); }
  .tag.hot { background: var(--green); color: #fff; }
  .slogan { display: flex; align-items: center; gap: 18px; justify-content: center; margin-top: 12px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 30px; letter-spacing: 3px; }
  .slogan::before, .slogan::after { content: ""; width: 110px; height: 2px; background: var(--ink); opacity: .6; }

  /* 主视觉 */
  .hero { display: flex; align-items: stretch; gap: 16px; margin-top: 14px; height: 340px; }
  .motto { width: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .motto .v.long { font-size: 38px; letter-spacing: 4px; }
  .motto .v.xlong { font-size: 32px; letter-spacing: 2px; }
  .motto .v { writing-mode: vertical-rl; font-family: "Ma Shan Zheng", serif; font-size: 46px; letter-spacing: 10px; color: var(--red); }
  .motto .seal { margin-top: 10px; writing-mode: vertical-rl; font-size: 16px; color: #fff; background: var(--red); padding: 8px 4px; border-radius: 3px; letter-spacing: 3px; }
  .hero-img { flex: 1; border-radius: 18px; overflow: hidden; position: relative;
    -webkit-mask-image: radial-gradient(ellipse 72% 78% at 50% 52%, #000 62%, transparent 100%); }
  .hero-img img { width: 100%; height: 100%; object-fit: cover; }

  /* 学校速览 */
  .basic { display: flex; margin-top: 12px; background: var(--card); border: 1.5px solid #e2d8c3; border-radius: 14px; }
  .basic div { flex: 1; padding: 7px 4px; white-space: nowrap; text-align: center; border-right: 1.5px dashed #e2d8c3; }
  .basic div:last-child { border-right: 0; }
  .basic small { display: block; font-size: 17px; color: var(--muted); }
  .basic span { font-size: 19px; font-weight: 700; }

  /* 排名条 */
  .ranks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .rank { background: var(--green); color: #fff; border-radius: 14px; padding: 10px 8px 8px; text-align: center; position: relative; overflow: hidden; }
  .rank:nth-child(2) { background: #2f6f8f; } .rank:nth-child(3) { background: #8a6a2c; } .rank:nth-child(4) { background: var(--red); }
  .rank .num { font-family: "Noto Serif SC", serif; font-weight: 900; font-size: 46px; line-height: 1; }
  .rank .num.long { font-size: 37px; padding: 4px 0 5px; }
  .rank .num em { font-style: normal; font-size: 20px; margin-left: 2px; font-weight: 700; }
  .rank .lb { font-size: 18px; margin-top: 6px; font-weight: 500; }
  .rank .yr { font-size: 15px; opacity: .8; }

  /* 模块 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .m { background: var(--card); border-radius: 16px; border: 1.5px solid #e6dcc7; overflow: hidden; display: flex; flex-direction: column; }
  .m h3 { font-size: 24px; font-weight: 900; color: #fff; padding: 7px 16px; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
  .m h3 .no { background: rgba(255,255,255,.95); color: inherit; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 17px; }
  .m .bd { padding: 8px 16px 10px; font-size: 19px; line-height: 1.5; color: var(--ink2); flex: 1; }
  .m.full { grid-column: 1 / -1; }
  .m1 h3 { background: var(--c1); } .m1 h3 .no { color: var(--c1); }
  .m2 h3 { background: var(--c2); } .m2 h3 .no { color: var(--c2); }
  .m3 h3 { background: var(--c3); } .m3 h3 .no { color: var(--c3); }
  .m4 .chip { background: #f6e6e2; }
  .m4 h3 { background: var(--c4); } .m4 h3 .no { color: var(--c4); }
  .m5 h3 { background: var(--c5); } .m5 h3 .no { color: var(--c5); }
  .m6 h3 { background: var(--c6); } .m6 h3 .no { color: var(--c6); }
  .m7 h3 { background: var(--c1); } .m7 h3 .no { color: var(--c1); }

  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: #cdbf9f; }
  .tl div { position: relative; margin-bottom: 3px; }
  .tl div::before { content: ""; position: absolute; left: -26px; top: 9px; width: 12px; height: 12px; border-radius: 50%; background: var(--c1); border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--c1); }
  .tl b { color: var(--c1); font-family: "Noto Serif SC", serif; font-size: 21px; margin-right: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: #eef3ee; color: var(--ink); border-radius: 8px; padding: 2px 10px; font-size: 18px; font-weight: 500; }
  .m2 .chip { background: #e8f0f4; } .m3 .chip { background: #f6eedb; }
  .note { margin-top: 8px; font-size: 18px; }
  .note b { color: var(--red); }
  .bigrate { display: flex; align-items: baseline; gap: 10px; }
  .bigrate strong { font-family: "Noto Serif SC", serif; font-size: 52px; color: var(--c4); line-height: 1.1; }
  .bigrate span { font-size: 18px; }
  .list div { padding-left: 16px; position: relative; }
  .list div::before { content: ""; position: absolute; left: 2px; top: 11px; width: 7px; height: 7px; background: currentColor; opacity: .5; transform: rotate(45deg); }
  .kv div { display: flex; gap: 10px; }
  .kv b { color: var(--ink); white-space: nowrap; }
  .kv .lm { display: block; white-space: nowrap; } .kv .lm span { font-size: 17px; margin-left: 8px; }
  .fit { display: flex; gap: 20px; }
  .fit > div { flex: 1; }
  .fit h4 { font-size: 20px; color: var(--ink); margin-bottom: 4px; }
  .req { display: flex; flex-direction: column; gap: 6px; }
  .req div { display: flex; justify-content: space-between; background: #eef3ee; border-radius: 8px; padding: 4px 12px; }
  .req b { color: var(--green); }

  /* 页脚 */
  .foot { margin: auto -44px 0; background: #0b3d2e; color: #fff; display: flex; align-items: center; gap: 22px; padding: 18px 44px; }
  .foot .qr { width: 118px; height: 118px; background: #fff; padding: 8px; border-radius: 10px; flex-shrink: 0; }
  .foot .qr svg { width: 100%; height: 100%; display: block; }
  .foot .t { flex: 1; min-width: 0; }
  .foot .t p { font-size: 34px; font-weight: 900; white-space: nowrap; }
  .foot .t p b { color: #ffc93c; }
  .foot .t div { font-size: 19px; opacity: .85; margin-top: 6px; }
  .foot .t small { display: block; font-size: 13px; opacity: .6; margin-top: 8px; }
</style>
</head>
<body>
<!--DATA-->
<div id="poster"></div>
<script>
const D = window.DATA;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const motto = D.motto.split(/\s+/);
const h = (cls, no, title, body) =>
  `<section class="m ${cls}"><h3><span class="no">${no}</span>${title}</h3><div class="bd">${body}</div></section>`;

document.getElementById("poster").innerHTML = `
  <div class="topbar">
    <div class="series">高考择校 · 名校速览</div>
    <div class="city"><i></i>${esc(D.city)}</div>
  </div>
  <h1 class="title" style="font-size:${Math.min(128, Math.floor(920 / D.name.length))}px">${esc(D.name)}</h1>
  <div class="en" style="${D.name_en.length > 48 ? "font-size:16px;letter-spacing:3px" : ""}">${esc(D.name_en)}</div>
  <div class="tags">${D.tags.map((t, i) => `<span class="tag ${i < 3 ? "hot" : ""}">${esc(t)}</span>`).join("")}</div>
  <div class="slogan">${esc(D.slogan)}</div>

  <div class="hero">
    <div class="motto"><div class="v ${motto[0].length > 6 ? "xlong" : motto[0].length > 4 ? "long" : ""}">${esc(motto[0])}</div><div class="seal">${esc(D.motto_label || "校训")}</div></div>
    <div class="hero-img"><img src="${D.hero}"></div>
    <div class="motto"><div class="v ${(motto[1] || "").length > 6 ? "xlong" : (motto[1] || "").length > 4 ? "long" : ""}">${esc(motto[1] || "")}</div><div class="seal">${esc(D.founded)}</div></div>
  </div>

  <div class="basic">
    <div><small>创办时间</small><span>${esc(D.founded)}年</span></div>
    ${D.basic.map(([k, v]) => `<div><small>${esc(k)}</small><span>${esc(v)}</span></div>`).join("")}
  </div>

  <div class="ranks" style="grid-template-columns: repeat(${D.rankings.length}, 1fr)">${D.rankings.map(r => `
    <div class="rank"><div class="num ${r.value.length > 4 ? "long" : ""}">${esc(r.value)}<em>${esc(r.unit)}</em></div>
    <div class="lb">${esc(r.label)}</div><div class="yr">${esc(r.year)}</div></div>`).join("")}
  </div>

  <div class="grid">
    ${h("m1", 1, "历史沿革", `<div class="tl">${D.history.map(([y, t]) => `<div><b>${esc(y)}</b>${esc(t)}</div>`).join("")}</div>`)}
    ${h("m2", 2, "学科实力", `<div class="chips">${D.double_first.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
      <div class="note">★ <b>${esc(D.eval_note)}</b></div>`)}
    ${h("m3", 3, "王牌专业", `<div class="chips">${D.majors.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
      <div class="note">以 <b>${esc(D.known_for)}</b> 著称</div>`)}
    ${h("m4", 4, "就业深造", `${D.career.rate_value
        ? `<div class="bigrate"><strong>${esc(D.career.rate_value)}</strong><span>${esc(D.career.rate_label)}<br>(${esc(D.career.rate_year)})</span></div>`
        : `<div class="note" style="margin-top:0"><b>${esc(D.career.title)}</b></div>`}
      <div class="chips" style="margin-top:6px">${D.career.directions.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>`)}
    ${h("m5", 5, "知名校友", `<div class="kv">${D.alumni.length
        ? D.alumni.map(([n, t]) => `<div><b>${esc(n)}</b>${esc(t)}</div>`).join("")
        : `<div>校友信息核实中，后续补充</div>`}</div>`)}
    ${h("m6", 6, "校园风物", `<div class="kv">${D.landmarks.map(([n, t]) => `<div class="lm"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join("")}</div>`)}
    ${h("m7 full", 7, "适合什么样的学生", `<div class="fit">
      <div class="list">${D.fit.map(s => `<div>${esc(s)}</div>`).join("")}</div>
      <div><h4>新高考选科要求</h4><div class="req">${D.subject_req.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></div>
    </div>`)}
  </div>

  <div class="foot">
    <div class="qr">${window.QR}</div>
    <div class="t"><p>${esc(D.encourage).replace(esc(D.short), `<b>${esc(D.short)}</b>`)}</p>
      <div>扫码访问官网 · ${esc(D.website_label)}</div>
      <small>${esc(D.source)}</small></div>
  </div>
`;

window.checkOverflow = () => {
  const bad = [];
  document.querySelectorAll(".m").forEach(el => {
    if (el.scrollHeight > el.clientHeight + 1) bad.push(el.querySelector("h3").innerText.trim());
  });
  document.querySelectorAll(".m .bd *, .basic div, .rank").forEach(el => {
    if (el.scrollWidth > el.clientWidth + 1) bad.push("横向溢出：" + el.innerText.trim().slice(0, 12));
  });
  const p = document.getElementById("poster");
  const g = document.querySelector(".grid").getBoundingClientRect().bottom;
  const f = document.querySelector(".foot").getBoundingClientRect().top;
  if (g > f + 1) bad.push("模块区压到页脚 " + Math.round(g - f) + "px");
  const last = p.lastElementChild.getBoundingClientRect().bottom;
  if (last > p.getBoundingClientRect().bottom + 1) bad.push("整体超出 " + Math.round(last - 1920) + "px");
  const enc = document.querySelector(".foot .t p");
  if (enc.scrollWidth > enc.clientWidth + 1) bad.push("激励语过长");
  return bad;
};
</script>
</body>
</html>
